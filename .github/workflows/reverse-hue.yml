name: Hue reverse engineering

on:
  workflow_dispatch:
  push:
    branches:
      - reverse-engineering/protobuf
    paths:
      - ".github/workflows/reverse-hue.yml"
      - "tools/reverse_hue/**"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch exact Hue arm64 APKS bundles
        run: |
          python tools/reverse_hue/fetch_apks.py 5.56.0 work/Hue-5.56.0.zip
          python tools/reverse_hue/fetch_apks.py 5.57.0 work/Hue-5.57.0.zip

      - name: Extract Flutter AOT libraries from arm64 split
        run: |
          set -euxo pipefail
          for version in 5.56.0 5.57.0; do
            bundle="work/bundle-$version"
            out="work/$version"
            mkdir -p "$bundle" "$out"
            unzip -q "work/Hue-$version.zip" -d "$bundle"
            arm64_split="$(find "$bundle" -type f \( -name 'config.arm64_v8a.apk' -o -name 'config.arm64_v8a' \) -print -quit)"
            test -n "$arm64_split"
            echo "arm64 split: $arm64_split"
            unzip -q "$arm64_split" \
              "lib/arm64-v8a/libapp.so" \
              "lib/arm64-v8a/libflutter.so" \
              -d "$out"
            file "$out/lib/arm64-v8a/libapp.so"
            sha256sum "$out/lib/arm64-v8a/libapp.so"
          done

      - name: Install Blutter dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build build-essential pkg-config \
            libicu-dev libcapstone-dev
          python -m pip install pyelftools requests

      - name: Run Blutter against Hue 5.57.0
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/worawit/blutter.git work/blutter-tool
          python work/blutter-tool/blutter.py \
            work/5.57.0/lib/arm64-v8a \
            work/blutter-5.57.0

      - name: Recover protobuf descriptors from Blutter
        run: |
          python tools/reverse_hue/extract_proto_candidates.py \
            --old work/blutter-5.57.0 \
            --new work/blutter-5.57.0 \
            --output reverse-output/blutter
          cat reverse-output/blutter/summary.md
          echo "===== Blutter target neighborhoods ====="
          sed -n '1,2400p' reverse-output/blutter/5.57.0-neighborhoods.txt

      - name: Upload textual RE results
        uses: actions/upload-artifact@v4
        with:
          name: hue-protobuf-reverse
          path: reverse-output/
          if-no-files-found: error
          retention-days: 7
