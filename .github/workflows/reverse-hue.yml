name: Hue reverse engineering

on:
  workflow_dispatch:
  push:
    branches:
      - reverse-engineering/protobuf
    paths:
      - ".github/workflows/reverse-hue.yml"
      - "tools/reverse_hue/**"
      - "src/huemanager/hue_private/**"
      - "tests/test_hue_private_proto.py"
      - "pyproject.toml"

concurrency:
  group: hue-reverse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch exact Hue arm64 APKS bundles
        run: |
          python tools/reverse_hue/fetch_apks.py 5.56.0 work/Hue-5.56.0.zip
          python tools/reverse_hue/fetch_apks.py 5.57.0 work/Hue-5.57.0.zip

      - name: Extract Flutter AOT libraries from arm64 split
        run: |
          set -euxo pipefail
          for version in 5.56.0 5.57.0; do
            bundle="work/bundle-$version"
            out="work/$version"
            mkdir -p "$bundle" "$out"
            unzip -q "work/Hue-$version.zip" -d "$bundle"
            arm64_split="$(find "$bundle" -type f \( -name 'config.arm64_v8a.apk' -o -name 'config.arm64_v8a' \) -print -quit)"
            test -n "$arm64_split"
            unzip -q "$arm64_split" \
              "lib/arm64-v8a/libapp.so" \
              "lib/arm64-v8a/libflutter.so" \
              -d "$out"
            file "$out/lib/arm64-v8a/libapp.so"
            sha256sum "$out/lib/arm64-v8a/libapp.so"
          done

      - name: Install Blutter dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build build-essential pkg-config \
            libicu-dev libcapstone-dev
          python -m pip install pyelftools requests

      - name: Run Blutter against Hue 5.57.0
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/worawit/blutter.git work/blutter-tool
          python work/blutter-tool/blutter.py \
            work/5.57.0/lib/arm64-v8a \
            work/blutter-5.57.0

      - name: Recover protobuf descriptors from Blutter
        run: |
          python tools/reverse_hue/extract_proto_candidates.py \
            --old work/blutter-5.57.0 \
            --new work/blutter-5.57.0 \
            --output reverse-output/blutter
          python tools/reverse_hue/recover_bridge_schema.py \
            work/blutter-5.57.0 \
            reverse-output/bridge
          cat reverse-output/bridge/bridge-migration-evidence.json
          cat reverse-output/bridge/bridge-enum-evidence.txt

      - name: Preserve focused reconstructed Dart evidence
        run: |
          set -euxo pipefail
          mkdir -p reverse-output/reconstructed reverse-output/orchestration
          while IFS= read -r file; do
            rel="${file#work/blutter-5.57.0/asm/}"
            mkdir -p "reverse-output/reconstructed/$(dirname "$rel")"
            cp "$file" "reverse-output/reconstructed/$rel"
          done < <(
            find work/blutter-5.57.0/asm -type f | grep -E \
              '(hue/accounts/v1/bridge\.(pb|pbenum|pbgrpc)\.dart|remote_bridge_client\.dart|grpc_request_utils\.dart|grpc_request_metadata_provider\.dart|authorization_token_resolver\.dart|move_data_to_target_bridge\.dart|bridge_migration_service\.dart|bridge_backup_and_restore/.*/(actions|middleware|client).*\.dart)'
          )

          grep -n -B 8 -A 12 -E \
            'Obj!(MergeStage|MigrationStage|BackupStage|DeviceMigrationStatus)|MERGE_STAGE_|MIGRATION_STAGE_|BACKUP_STAGE_|DEVICE_MIGRATION_STATUS_' \
            work/blutter-5.57.0/pp.txt \
            > reverse-output/orchestration/migration-enum-objects.txt || true

          grep -n -B 4 -A 10 -E \
            '28a2151|28a2131|28a2111|28a2071|Obj!(MergeStage|DeviceMigrationStatus)' \
            work/blutter-5.57.0/objs.txt \
            > reverse-output/orchestration/missing-enum-objects.txt || true

          strings work/5.57.0/lib/arm64-v8a/libapp.so | grep -E \
            'MERGE_STAGE_|DEVICE_MIGRATION_STATUS_' \
            > reverse-output/orchestration/migration-enum-strings.txt || true

          grep -R -n -C 35 -E \
            'eligibleDevices|determineDevicesEligibleForDeviceMigration|StartDeviceMigrationActionParams|StartBridgeMergeDeviceMigrationActionParams' \
            work/blutter-5.57.0/asm/bridge_backup_and_restore \
            > reverse-output/orchestration/eligible-devices.txt || true

          grep -R -n -C 45 -E \
            'BridgeMigrationClient|BridgeMergeClient|createBridgeBackupJob|CreateBridgeBackupJob|backupJobId|bridgeResourceUuid|fetchBridgeResource|device_migration|device migration' \
            work/blutter-5.57.0/asm/bridge_backup_and_restore \
            > reverse-output/orchestration/backup-and-local-clients.txt || true

          grep -R -l -E \
            'DeviceMigrationStartedAction|BridgeMergeDeviceMigrationStartedAction|eligibleDevices' \
            work/blutter-5.57.0/asm/bridge_backup_and_restore \
            > reverse-output/orchestration/device-migration-consumer-files.txt || true
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            rel="${file#work/blutter-5.57.0/asm/}"
            mkdir -p "reverse-output/consumers/$(dirname "$rel")"
            cp "$file" "reverse-output/consumers/$rel"
          done < reverse-output/orchestration/device-migration-consumer-files.txt

          grep -R -n -C 30 -E \
            'authorization|Bearer|CallOptions|metadata|ClientChannel|api.account.meethue.com' \
            work/blutter-5.57.0/asm/account_management \
            > reverse-output/orchestration/grpc-auth.txt || true

      - name: Verify Hue private client in project
        run: |
          python -m pip install -e '.[dev]'
          mkdir -p /tmp/hue-protoc
          python -m grpc_tools.protoc \
            -I src/huemanager/hue_private/proto \
            --python_out=/tmp/hue-protoc \
            --grpc_python_out=/tmp/hue-protoc \
            src/huemanager/hue_private/proto/bridge.proto
          ruff check src tests
          pytest -q

      - name: Upload textual RE results
        uses: actions/upload-artifact@v4
        with:
          name: hue-protobuf-reverse
          path: reverse-output/
          if-no-files-found: error
          retention-days: 7
