[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huemanager"
version = "0.3.0"
description = "Selective Philips Hue migration and dependency-aware bridge manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "requests>=2.32,<3",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
huemanager = "huemanager.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/huemanager"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
